<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブラウザゲームサイト</title>
  <link rel="stylesheet" href="css/style.css" type="text/css">
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.10.1/pixi.min.js"></script>
  <script>
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') { // スペースキースクロールの無効化
        event.preventDefault();
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ブラウザゲームサイト</h1>
      <nav>
        <ul>
          <li><a href="#">SNSリンク</a></li>
          <li><a href="#">SNSリンク</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>

    <div class="main-content">
      <aside class="instruction">
        <h2>ゲーム操作説明</h2>
        <p>
          ここにゲームの説明が入ります。<br>
          操作方法、ルールなど<br>
          ヒント：◯◯◯
        </p>
        <p>
          <br>
          <strong>その他情報</strong><br>
          ・制作者: あなた<br>
          ・ハイスコア: 9999点
        </p>
      </aside>
      <main class="main-column">
        <div class="game-screen">
        </div>
        <h2>現在のゲームタイトル</h2>
      </main>
    </div>

    <section class="recommend">
      <h3>他のゲーム</h3>
      <div class="game-slider-placeholder">
        <div class="game-thumbnail">サムネイル1<br>ゲームA</div>
        <div class="game-thumbnail">サムネイル2<br>ゲームB</div>
        <div class="game-thumbnail">サムネイル3<br>ゲームC</div>
        <div class="game-thumbnail">サムネイル4<br>ゲームD</div>
        <div class="game-thumbnail">サムネイル5<br>ゲームE</div>
      </div>
    </section>

    <footer>
      <!-- footer -->
    </footer>

  </div>
</body>
<script type="module" src="js/jump.js"></script>
</html>
