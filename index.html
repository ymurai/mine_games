<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブラウザゲームサイト</title>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.10.1/pixi.min.js"></script>

  
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #f0f0f0; /* 全体の背景色 */
    }
    .container {
      width: 1200px; /* 全体のページ幅 */
      margin: 0 auto; /* 中央寄せ */
      background-color: #ffffff; /* コンテンツエリアの背景色 */
      box-shadow: 0 0 10px rgba(0,0,0,0.1); /* 影で少し立体感を出す */
    }
    header {
      height: 80px; /* ヘッダーの高さ */
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav li {
      margin-left: 20px;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    .main-content {
      display: flex; /* サイドバーとメインカラムを横並びにする */
      padding: 20px;
      box-sizing: border-box; /* パディングを幅に含める */
    }
    .instruction {
      width: 320px;
      background-color: #e9e9e9;
      padding: 15px;
      margin-right: 30px; /* メインカラムとの間隔 */
      box-sizing: border-box;
    }
    .instruction h2 {
      font-size: 1.2em;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      margin-top: 0;
    }
    .main-column {
      flex-grow: 1; /* 残りの幅をすべて使用 */
      /* width: 800px; (flex-growで自動調整されるため、明示的に指定しないことが多い) */
      background-color: #f7f7f7;
      padding: 15px;
      box-sizing: border-box;
    }
    .game-screen {
      width: 800px;
      height: 600px;
      margin: 0 15px;
      background-color: #ccc; /* ゲーム画面のプレースホルダー */
      border: 1px solid #999;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2em;
      color: #666;
      margin-bottom: 20px; /* 下のコンテンツとの間隔 */
    }
    .recommend {
      width: 1160px; /* スライドバーの幅 */
      margin: 20px auto; /* 中央寄せと上下の余白 */
      background-color: #e9e9e9;
      padding: 10px;
      text-align: center;
      height: 240px; /* スライドバーの高さ */
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .recommend h3 {
      width: 100%;
      margin-top: 0;
      margin-bottom: 10px;
      margin-left: 90px;
      text-align: left;
    }
    .game-slider-placeholder {
      display: flex;
      gap: 10px;
      overflow: hidden; /* スライドバーなのではみ出た分は隠す */
      width: 100%;
      justify-content: center;
    }
    .game-thumbnail {
      width: 200px; /* サムネイルの例 */
      height: 150px;
      background-color: #aaa;
      border: 1px solid #888;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8em;
      color: white;
      flex-shrink: 0; /* スライド時に縮まないように */
    }
    footer {
      height: 60px; /* フッターの高さ */
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ブラウザゲームサイト</h1>
      <nav>
        <ul>
          <li><a href="#">SNSリンク</a></li>
          <li><a href="#">SNSリンク</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>

    <div class="main-content">
      <aside class="instruction">
        <h2>ゲーム操作説明</h2>
        <p>
          ここにゲームの説明が入ります。<br>
          操作方法、ルールなど<br>
          ヒント：◯◯◯
        </p>
        <p>
          <br>
          <strong>その他情報</strong><br>
          ・制作者: あなた<br>
          ・ハイスコア: 9999点
        </p>
      </aside>
      <main class="main-column">
        <div class="game-screen">
        </div>
        <h2>現在のゲームタイトル</h2>
      </main>
    </div>

    <section class="recommend">
      <h3>他のゲーム</h3>
      <div class="game-slider-placeholder">
        <div class="game-thumbnail">サムネイル1<br>ゲームA</div>
        <div class="game-thumbnail">サムネイル2<br>ゲームB</div>
        <div class="game-thumbnail">サムネイル3<br>ゲームC</div>
        <div class="game-thumbnail">サムネイル4<br>ゲームD</div>
        <div class="game-thumbnail">サムネイル5<br>ゲームE</div>
      </div>
    </section>

    <footer>
      <!-- footer -->
    </footer>

  </div>
</body>
<script type="module" src="js/jump.js"></script>
</html>
